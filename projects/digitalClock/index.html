<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Analog Clock</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="center">
    <div class="wrapper">
      <div class="clock-container">
        <div class="analog-clock">
          <div class="clock-face">
            <div class="numbers">
              <span class="num num1">12</span>
              <span class="num num2">1</span>
              <span class="num num3">2</span>
              <span class="num num4">3</span>
              <span class="num num5">4</span>
              <span class="num num6">5</span>
              <span class="num num7">6</span>
              <span class="num num8">7</span>
              <span class="num num9">8</span>
              <span class="num num10">9</span>
              <span class="num num11">10</span>
              <span class="num num12">11</span>
            </div>
            <div class="hands">
              <div class="hand hour-hand" id="hour"></div>
              <div class="hand minute-hand" id="minute"></div>
              <div class="hand second-hand" id="second"></div>
              <div class="center-dot"></div>
            </div>
          </div>
        </div>
        <div class="digital-time" id="digitalTime">00:00:00</div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
